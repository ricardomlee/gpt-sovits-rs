<!doctype html>
<html lang="en">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>SoVITS Wasm Lab</title>
<style>
  :root { color-scheme: light dark; font: 16px system-ui; }
  body { margin: 3rem auto; padding: 0 1.25rem; max-width: 42rem; }
  h1 { font-size: 1.6rem; }
  form, label, fieldset { display: grid; grid-template-columns: minmax(0, 1fr); gap: .6rem; }
  form { gap: 1rem; }
  fieldset { margin: 0; min-width: 0; }
  button, input, textarea { font: inherit; max-width: 100%; }
  input[type="file"] { width: 100%; min-width: 0; }
  textarea { resize: vertical; }
  button { justify-self: start; padding: .45rem .8rem; }
  audio:not([hidden]) { display: block; width: 100%; margin: 1rem 0; }
  output { display: block; margin-top: 1rem; overflow-wrap: anywhere; }
</style>
<h1>SoVITS Wasm Lab</h1>
<form>
  <fieldset>
    <legend>Local voice</legend>
    <label>SoVITS weights <input name="sovits" type="file" accept=".safetensors" required></label>
    <label>GPT weights <input name="gpt" type="file" accept=".safetensors" required></label>
    <label>BERT weights <input name="bert" type="file" accept=".safetensors" required></label>
    <label>BERT tokenizer <input name="tokenizer" type="file" accept=".json" required></label>
    <label>Prepared reference <input name="reference" type="file" accept=".safetensors" required></label>
  </fieldset>
  <label>Mandarin text <textarea name="text" rows="2" maxlength="80" required></textarea></label>
  <div>
    <button type="submit">Render WAV</button>
    <button id="unload" type="button" disabled>Unload voice</button>
  </div>
</form>
<output id="result" role="status"></output>
<audio controls hidden></audio>
<a id="download" download="sovits-wasm.wav" hidden>Download WAV</a>
<script type="module">
  const form = document.querySelector('form');
  const inputs = form.querySelector('fieldset');
  const button = form.querySelector('[type="submit"]');
  const unload = document.querySelector('#unload');
  const result = document.querySelector('#result');
  const audio = document.querySelector('audio');
  const download = document.querySelector('#download');
  const mib = (bytes) => (bytes / 2 ** 20).toFixed(1);

  let worker;

  function clearAudio() {
    if (audio.src) URL.revokeObjectURL(audio.src);
    audio.removeAttribute('src');
    audio.load();
    audio.hidden = download.hidden = true;
  }

  function reset() {
    worker?.terminate();
    worker = undefined;
    inputs.disabled = button.disabled = false;
    unload.disabled = true;
  }

  unload.addEventListener('click', () => {
    reset();
    result.textContent = 'Voice unloaded';
  });

  function startWorker() {
    const current = new Worker('./worker.js', { type: 'module' });
    worker = current;
    current.onmessage = ({ data }) => {
      if (current !== worker) return;
      if (data.stage) {
        result.textContent = data.stage;
        return;
      }
      button.disabled = false;
      if (data.error) {
        if (data.reset) reset();
        result.textContent = data.error;
        return;
      }
      const { wav, loadMs, renderMs, peakBytes } = data;
      const url = URL.createObjectURL(new Blob([wav], { type: 'audio/wav' }));
      audio.src = download.href = url;
      audio.hidden = download.hidden = false;
      const load = loadMs === undefined ? '' : `Load ${Math.round(loadMs)} ms · `;
      result.textContent = `${load}Render ${Math.round(renderMs)} ms · Wasm memory ${mib(peakBytes)} MiB`;
    };
    current.onerror = (error) => {
      if (current !== worker) return;
      reset();
      result.textContent = error.message || 'Worker failed';
    };
  }

  form.addEventListener('submit', (event) => {
    event.preventDefault();
    clearAudio();
    let files;
    if (!worker) {
      files = Object.fromEntries(Array.from(inputs.querySelectorAll('input'), (input) => [input.name, input.files[0]]));
      startWorker();
    }
    inputs.disabled = button.disabled = true;
    unload.disabled = false;
    result.textContent = 'Rendering...';
    worker.postMessage({ files, text: form.elements.text.value });
  });
</script>
</html>
