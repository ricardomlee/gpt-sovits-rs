name: CI

on:
  push:
    branches: [master]
  pull_request:
    branches: [master]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  CARGO_TERM_COLOR: always
  CARGO_INCREMENTAL: 0

jobs:
  quality:
    name: Format, lint, and test
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
      - uses: rhysd/actionlint@v1.7.9
      - name: Check deployment scripts and Compose examples
        run: |
          shellcheck examples/first-run/*.sh examples/trained-voice/prepare.sh tests/trained_voice_prepare.sh examples/verify-http-formats.sh site/build.sh
          bash tests/trained_voice_prepare.sh
          docker compose --env-file .env.example -f compose.cpu.yml config --quiet
          docker compose --env-file .env.example -f compose.cuda.yml config --quiet

      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libsoxr-dev libmp3lame-dev cmake

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy

      - uses: Swatinem/rust-cache@v2

      - name: Check formatting
        run: cargo fmt --all -- --check

      - name: Run Clippy
        run: cargo clippy --locked --all-targets --features http-api -- -D warnings

      - name: Check library documentation
        env:
          RUSTDOCFLAGS: -D warnings
        run: cargo doc --locked --no-deps --lib --features http-api

      - name: Run tests
        run: |
          cargo test --locked --features http-api
          cargo test --locked --example speech_regression
          cargo test --locked --example gpu_benchmark

  http-client:
    name: Standalone HTTP client
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: client

      - name: Check client without inference dependencies
        run: |
          cargo fmt --manifest-path client/Cargo.toml -- --check
          cargo clippy --locked --manifest-path client/Cargo.toml --all-targets -- -D warnings
          cargo test --locked --manifest-path client/Cargo.toml
