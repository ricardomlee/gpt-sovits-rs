[package]
name = "wasm-sovits"
version = "0.1.0"
edition = "2021"
publish = false
autobins = false

[lib]
crate-type = ["cdylib", "rlib"]

[[example]]
name = "native"

[dependencies]
candle-core = "=0.11.1"
gpt-sovits-rs = { path = "../..", default-features = false }
safetensors = "0.8"
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[target.'cfg(target_arch = "wasm32")'.dependencies]
wasm-bindgen = "=0.2.130"

[dev-dependencies]
anyhow = "1"

[profile.release]
lto = "thin"
codegen-units = 1
