<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="color-scheme" content="light">
  <title>浏览器语音实验 | GPT-SoVITS-RS</title>
  <link rel="stylesheet" href="lab.css">
</head>
<body>
<header class="topbar">
  <nav class="wrap" aria-label="主导航">
    <a class="wordmark" href="../"><span aria-hidden="true"></span>GPT-SoVITS-RS</a>
    <span class="mono">WASM LAB</span>
  </nav>
</header>
<main class="wrap">
  <div class="heading">
    <p class="mono">WEBASSEMBLY / 实验</p>
    <h1>浏览器语音实验</h1>
    <p>桌面浏览器 · Sun 实测约 2 GiB Wasm 内存</p>
  </div>
  <noscript><p>生成语音需要启用 JavaScript。</p></noscript>
  <form class="workspace">
    <fieldset>
      <legend>本地模型</legend>
      <label>SoVITS 权重 <input name="sovits" type="file" accept=".safetensors" required></label>
      <label>GPT 权重 <input name="gpt" type="file" accept=".safetensors" required></label>
      <label>BERT 权重 <input name="bert" type="file" accept=".safetensors" required></label>
      <label>BERT tokenizer <input name="tokenizer" type="file" accept=".json" required></label>
      <label>参考特征 <input name="reference" type="file" accept=".safetensors" required></label>
      <a href="https://github.com/ricardomlee/gpt-sovits-rs/tree/master/experiments/wasm-sovits#prepare-a-voice">准备音色 <span aria-hidden="true">↗</span></a>
    </fieldset>
    <div class="compose">
      <label>中文文本 <textarea name="text" rows="4" maxlength="80" placeholder="你好，很高兴见到你。" required></textarea></label>
      <div class="actions">
        <button type="submit" disabled>生成 WAV</button>
        <button id="unload" type="button" disabled>卸载模型</button>
      </div>
      <output id="result" role="status" class="mono"></output>
      <audio controls aria-label="播放生成的语音" hidden></audio>
      <a id="download" download="sovits-wasm.wav" hidden>下载 WAV <span aria-hidden="true">↓</span></a>
    </div>
  </form>
</main>
<script type="module">
  const form = document.querySelector('form');
  const inputs = form.querySelector('fieldset');
  const button = form.querySelector('[type="submit"]');
  const unload = document.querySelector('#unload');
  const result = document.querySelector('#result');
  const audio = document.querySelector('audio');
  const download = document.querySelector('#download');
  const mib = (bytes) => (bytes / 2 ** 20).toFixed(1);

  let worker;

  function clearAudio() {
    if (audio.src) URL.revokeObjectURL(audio.src);
    audio.removeAttribute('src');
    audio.load();
    audio.hidden = download.hidden = true;
  }

  function reset() {
    worker?.terminate();
    worker = undefined;
    inputs.disabled = button.disabled = false;
    unload.disabled = true;
  }

  unload.addEventListener('click', () => {
    reset();
    result.textContent = '模型已卸载';
  });

  function startWorker() {
    const current = new Worker('./worker.js', { type: 'module' });
    worker = current;
    current.onmessage = ({ data }) => {
      if (current !== worker) return;
      if (data.stage) {
        result.textContent = data.stage;
        return;
      }
      button.disabled = false;
      if (data.error) {
        if (data.reset) reset();
        result.textContent = data.error;
        return;
      }
      const { wav, loadMs, renderMs, peakBytes } = data;
      const url = URL.createObjectURL(new Blob([wav], { type: 'audio/wav' }));
      audio.src = download.href = url;
      audio.hidden = download.hidden = false;
      const load = loadMs === undefined ? '' : `加载 ${Math.round(loadMs)} ms · `;
      result.textContent = `${load}合成 ${Math.round(renderMs)} ms · Wasm 内存 ${mib(peakBytes)} MiB`;
    };
    current.onerror = (error) => {
      if (current !== worker) return;
      reset();
      result.textContent = error.message || '语音 Worker 启动失败';
    };
  }

  form.addEventListener('submit', (event) => {
    event.preventDefault();
    clearAudio();
    let files;
    if (!worker) {
      files = Object.fromEntries(Array.from(inputs.querySelectorAll('input'), (input) => [input.name, input.files[0]]));
      startWorker();
    }
    inputs.disabled = button.disabled = true;
    unload.disabled = false;
    result.textContent = '正在生成…';
    worker.postMessage({ files, text: form.elements.text.value });
  });
  button.disabled = false;
</script>
</body>
</html>
