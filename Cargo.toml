[package]
name = "gpt-sovits-rs"
version = "1.3.4"
edition = "2024"
authors = ["GPT-SoVITS Rust Contributors"]
description = "High-performance Rust implementation of GPT-SoVITS TTS inference engine"
license = "MIT"
repository = "https://github.com/ricardomlee/gpt-sovits-rs"
keywords = ["tts", "speech", "ai", "inference", "rust"]
categories = ["multimedia::audio", "science"]

[lib]
name = "gpt_sovits_rs"
path = "src/lib.rs"

[[bin]]
name = "gpt-sovits"
path = "src/main.rs"

[[bin]]
name = "gpt-sovits-convert"
path = "src/bin/gpt-sovits-convert.rs"

[[example]]
name = "cuda_oxide_candle"
path = "examples/cuda_oxide_candle.rs"
required-features = ["cuda"]

[[example]]
name = "compare_cuda_graph_tokens"
path = "examples/compare_cuda_graph_tokens.rs"
required-features = ["cuda"]

[dependencies]
# Deep Learning Inference
candle-core = "0.11.1"
candle-nn = "0.11.1"
candle-transformers = "0.11.1"
half = { version = "2.4", features = ["num-traits", "zerocopy"] }

# Audio Processing
hound = "3.5"                    # WAV I/O
rustfft = "6.1"                  # FFT for mel spectrogram extraction

# Serialization
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
safetensors = "0.8"
zip = { version = "9.6", default-features = false }

# Text Processing
jieba-rs = "0.6"                 # Chinese word segmentation
pinyin = "0.10"                  # Basic pinyin conversion
tokenizers = { version = "0.23.2", default-features = false, features = ["fancy-regex"] }  # HuggingFace tokenizers for BERT

# Parallelism & Performance
rayon = "1.10"
rand = "0.9"
rand_distr = "0.5"

# Async Runtime (for HTTP API)
tokio = { version = "1.40", features = ["full"], optional = true }
tokio-stream = { version = "0.1", optional = true }
axum = { version = "0.8.9", optional = true }
tower-http = { version = "0.7.1", features = ["cors", "trace"], optional = true }
base64 = { version = "0.23.1", optional = true }
lame-sys = { version = "0.1.2", optional = true, default-features = false }
opus = { version = "0.4", optional = true }
ogg = { version = "0.9", optional = true }

# CLI & Utilities
clap = { version = "4.5", features = ["derive", "env"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
thiserror = "2.0"
anyhow = "1.0"

[target.'cfg(not(target_arch = "wasm32"))'.dependencies]
soxr = "0.6" # matches librosa's soxr_hq

[target.'cfg(target_arch = "wasm32")'.dependencies]
getrandom = { version = "0.3.4", features = ["wasm_js"] }
web-time = "1.1"

[dev-dependencies]
criterion = { version = "0.8.2", features = ["html_reports"] }
symphonia = { version = "0.6.1", default-features = false, features = ["mp3"] }
tempfile = "3.14"
sha2 = "0.11.1"
pulldown-cmark = { version = "0.13", default-features = false }

[features]
default = []
cuda = ["candle-core/cuda", "candle-nn/cuda", "candle-transformers/cuda"]
http-api = ["tokio", "tokio-stream", "axum", "tower-http", "base64", "lame-sys", "opus", "ogg"]
mkl = ["candle-core/mkl"]

[profile.release]
lto = "thin"
codegen-units = 1
opt-level = 3

[profile.release-fast]
inherits = "release"
lto = false

# Faster iteration profile; measure it separately from release builds.
[profile.dev-gpu]
inherits = "release"
codegen-units = 16
opt-level = 2
lto = false
debug = false

[[bench]]
name = "inference_bench"
harness = false

[[bench]]
name = "conv1d_cpu_bench"
harness = false
required-features = ["mkl"]
