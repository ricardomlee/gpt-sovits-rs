name: Release

on:
  push:
    tags:
      - "v[0-9]+.[0-9]+.[0-9]+"

permissions:
  contents: write
  packages: write

env:
  CARGO_TERM_COLOR: always
  CARGO_INCREMENTAL: 0
  IMAGE_NAME: ghcr.io/${{ github.repository }}

jobs:
  preflight:
    name: Verify release metadata
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
      - name: Require matching package version and release notes
        run: |
          version=$(cargo metadata --no-deps --format-version 1 --locked | jq -r '.packages[] | select(.name == "gpt-sovits-rs") | .version')
          client_version=$(cargo metadata --manifest-path client/Cargo.toml --no-deps --format-version 1 --locked | jq -r '.packages[] | select(.name == "gpt-sovits-client") | .version')
          test "$client_version" = "$version"
          test "v$version" = "$GITHUB_REF_NAME"
          test -s "docs/releases/$GITHUB_REF_NAME.md"

  linux-binary:
    needs: preflight
    name: Linux x86_64 binary
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v7

      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libsoxr-dev libmp3lame-dev cmake patchelf

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2
        with:
          key: release-linux

      - name: Build
        env:
          XDG_DATA_HOME: ${{ runner.temp }}/gpt-sovits-build-data
        run: |
          bash .github/prepare-mkl.sh
          cargo build --release --locked --features http-api,mkl
          cargo build --release --locked --manifest-path client/Cargo.toml --target-dir target

      - name: Package
        shell: bash
        run: |
          set -euo pipefail
          version="${GITHUB_REF_NAME#v}"
          package="gpt-sovits-${version}-linux-x86_64"
          mkdir -p "dist/${package}/lib"
          cp target/release/gpt-sovits "dist/${package}/"
          cp target/release/gpt-sovits-convert "dist/${package}/"
          cp target/release/gpt-sovits-client "dist/${package}/"
          install -m 755 examples/first-run/prepare-models.sh "dist/${package}/"
          cp examples/first-run/models.toml "dist/${package}/"
          soxr="$(ldconfig -p | awk '$1 == "libsoxr.so.0" { print $NF; exit }')"
          cp -L "${soxr}" "dist/${package}/lib/libsoxr.so.0"
          lame="$(ldconfig -p | awk '$1 == "libmp3lame.so.0" { print $NF; exit }')"
          cp -L "${lame}" "dist/${package}/lib/libmp3lame.so.0"
          cp LICENSE THIRD_PARTY.md "dist/${package}/"
          cp -R licenses "dist/${package}/"
          rpath="\$ORIGIN/lib"
          patchelf --set-rpath "${rpath}" "dist/${package}/gpt-sovits"
          patchelf --set-rpath "${rpath}" "dist/${package}/gpt-sovits-convert"
          strip "dist/${package}/gpt-sovits"
          strip "dist/${package}/gpt-sovits-convert"
          strip "dist/${package}/gpt-sovits-client"
          tar -C dist -czf "dist/${package}.tar.gz" "${package}"

      - uses: actions/upload-artifact@v7
        with:
          name: linux-binary
          path: dist/*.tar.gz
          if-no-files-found: error

  macos-binary:
    needs: preflight
    name: macOS ${{ matrix.arch }} binary
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: macos-15-intel
            arch: x86_64
          - runner: macos-15
            arch: aarch64
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@v7

      - name: Install audio libraries
        run: brew install libsoxr lame cmake

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2
        with:
          key: release-macos-${{ matrix.arch }}

      - name: Build
        run: |
          LAME_LIB_DIR="$(brew --prefix lame)/lib"
          export LAME_LIB_DIR
          cargo build --release --locked --features http-api
          cargo build --release --locked --manifest-path client/Cargo.toml --target-dir target

      - name: Package
        shell: bash
        run: |
          set -euo pipefail
          version="${GITHUB_REF_NAME#v}"
          package="gpt-sovits-${version}-macos-${{ matrix.arch }}"
          mkdir -p "dist/${package}"
          cp target/release/gpt-sovits "dist/${package}/"
          cp target/release/gpt-sovits-convert "dist/${package}/"
          cp target/release/gpt-sovits-client "dist/${package}/"
          install -m 755 examples/first-run/prepare-models.sh "dist/${package}/"
          cp examples/first-run/models.toml "dist/${package}/"
          soxr="$(brew --prefix libsoxr)/lib/libsoxr.0.dylib"
          cp -L "${soxr}" "dist/${package}/libsoxr.0.dylib"
          old_soxr="$(otool -L "dist/${package}/gpt-sovits" | awk '/libsoxr/ { print $1; exit }')"
          install_name_tool -change "${old_soxr}" \
            '@loader_path/libsoxr.0.dylib' "dist/${package}/gpt-sovits"
          lame="$(brew --prefix lame)/lib/libmp3lame.0.dylib"
          cp -L "${lame}" "dist/${package}/libmp3lame.0.dylib"
          old_lame="$(otool -L "dist/${package}/gpt-sovits" | awk '/libmp3lame/ { print $1; exit }')"
          install_name_tool -change "${old_lame}" \
            '@loader_path/libmp3lame.0.dylib' "dist/${package}/gpt-sovits"
          mpg123="$(brew --prefix mpg123)"
          cp -L "$mpg123/lib/libmpg123.0.dylib" "dist/${package}/"
          old_mpg123="$(otool -L "$lame" | awk '/libmpg123/ { print $1; exit }')"
          chmod u+w "dist/${package}/libmp3lame.0.dylib"
          install_name_tool -change "$old_mpg123" \
            '@loader_path/libmpg123.0.dylib' "dist/${package}/libmp3lame.0.dylib"
          codesign --force --sign - "dist/${package}/libmp3lame.0.dylib"
          cp LICENSE THIRD_PARTY.md "dist/${package}/"
          cp -R licenses "dist/${package}/"
          mkdir "dist/${package}/licenses/mpg123"
          cp "$mpg123"/{AUTHORS,COPYING} "dist/${package}/licenses/mpg123/"
          strip -x "dist/${package}/gpt-sovits"
          strip -x "dist/${package}/gpt-sovits-convert"
          strip -x "dist/${package}/gpt-sovits-client"
          codesign --force --sign - "dist/${package}/gpt-sovits"
          tar -C dist -czf "dist/${package}.tar.gz" "${package}"

      - name: Check the extracted binaries and bundled audio libraries
        shell: bash
        run: |
          tar -xzf dist/*.tar.gz -C "$RUNNER_TEMP"
          cd "$RUNNER_TEMP/gpt-sovits-${GITHUB_REF_NAME#v}-macos-${{ matrix.arch }}"
          otool -l ./gpt-sovits* ./*.dylib | awk '
            $1 == "cmd" { dep = ($2 ~ /DYLIB$/ && $2 != "LC_ID_DYLIB") }
            dep && $1 == "name" {print $2}' | sort -u | while read -r lib; do
            case "$lib" in
              /usr/lib/*|/System/Library/*) continue ;;
              @loader_path/*) [[ -f "${lib#@loader_path/}" ]] && continue ;;
            esac
            echo "Unbundled dependency: $lib" >&2
            exit 1
          done
          ./gpt-sovits --version
          ./gpt-sovits-convert --version
          ./gpt-sovits-client --version
          ./prepare-models.sh --help

      - uses: actions/upload-artifact@v7
        with:
          name: macos-${{ matrix.arch }}-binary
          path: dist/*.tar.gz
          if-no-files-found: error

  windows-binary:
    needs: preflight
    uses: ./.github/workflows/windows.yml
    permissions:
      contents: read

  cpu-image:
    needs: preflight
    name: Build CPU image
    runs-on: ubuntu-24.04
    outputs:
      image: ${{ steps.repo.outputs.name }}@${{ steps.build.outputs.digest }}
      tags: ${{ steps.meta.outputs.tags }}
    steps:
      - uses: actions/checkout@v7

      - uses: docker/setup-buildx-action@v4

      - name: Log in to GHCR
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Image metadata
        id: meta
        uses: docker/metadata-action@v6
        with:
          images: ${{ env.IMAGE_NAME }}
          tags: |
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=raw,value=latest

      - id: repo
        run: echo "name=ghcr.io/${GITHUB_REPOSITORY,,}" >> "$GITHUB_OUTPUT"

      - name: Build CPU image by digest
        id: build
        uses: docker/build-push-action@v7
        with:
          context: .
          file: Dockerfile
          platforms: linux/amd64
          outputs: type=image,name=${{ steps.repo.outputs.name }},push-by-digest=true,name-canonical=true,push=true
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  cuda-image:
    needs: preflight
    name: CUDA sm${{ matrix.compute_cap }} container
    strategy:
      fail-fast: false
      matrix:
        compute_cap: [75, 86, 89, 90]
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7

      - uses: docker/setup-buildx-action@v4

      - name: Log in to GHCR
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Image metadata
        id: meta
        uses: docker/metadata-action@v6
        with:
          images: ${{ env.IMAGE_NAME }}
          tags: |
            type=semver,pattern={{version}},suffix=-cuda-sm${{ matrix.compute_cap }}
            type=semver,pattern={{major}}.{{minor}},suffix=-cuda-sm${{ matrix.compute_cap }}
            type=raw,value=latest-cuda-sm${{ matrix.compute_cap }}

      - name: Build and push
        uses: docker/build-push-action@v7
        with:
          context: .
          file: Dockerfile.cuda
          platforms: linux/amd64
          build-args: CUDA_COMPUTE_CAP=${{ matrix.compute_cap }}
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  github-release:
    name: Verify and publish release
    needs: [linux-binary, macos-binary, windows-binary, cpu-image, cuda-image]
    runs-on: ubuntu-24.04
    env:
      DEMO_IMAGE: ${{ needs.cpu-image.outputs.image }}
    steps:
      - uses: actions/checkout@v7

      - uses: actions/download-artifact@v8
        with:
          pattern: "*-binary"
          path: dist
          merge-multiple: true

      - uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Install acceptance tools
        run: |
          sudo apt-get update
          sudo apt-get install -y libsoxr-dev ffmpeg jq
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2

      - name: Verify Compose, HTTP audio and the extracted archive
        env:
          DEMO_PULL_POLICY: never
        run: |
          export DEMO_EXPECTED_VERSION="${GITHUB_REF_NAME#v}"
          docker pull "$DEMO_IMAGE"
          GPT_SOVITS_SMOKE_IMAGE="$DEMO_IMAGE" cargo test --locked --test deployment_smoke -- --ignored --nocapture
          bash examples/first-run/verify.sh "$RUNNER_TEMP/demo" "$RUNNER_TEMP/evidence"
          bash examples/first-run/verify-archive.sh "dist/gpt-sovits-$DEMO_EXPECTED_VERSION-linux-x86_64.tar.gz" \
            "$RUNNER_TEMP/demo" "$RUNNER_TEMP/verified-archive"

      - name: Upload acceptance audio and diagnostics
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: linux-acceptance
          path: |
            ${{ runner.temp }}/evidence/
            ${{ runner.temp }}/verified-archive/offline.wav
          retention-days: 7
          if-no-files-found: ignore

      - name: Create checksums
        working-directory: dist
        run: sha256sum ./*.tar.gz ./*.zip > SHA256SUMS

      - name: Publish CPU tags for the verified digest
        env:
          TAGS: ${{ needs.cpu-image.outputs.tags }}
        run: |
          args=()
          while IFS= read -r tag; do args+=(--tag "$tag"); done <<< "$TAGS"
          docker buildx imagetools create --prefer-index=false "${args[@]}" "$DEMO_IMAGE"

      - name: Publish release
        uses: softprops/action-gh-release@v3
        with:
          body_path: docs/releases/${{ github.ref_name }}.md
          files: |
            dist/*.tar.gz
            dist/*.zip
            dist/SHA256SUMS
          fail_on_unmatched_files: true
          generate_release_notes: false
