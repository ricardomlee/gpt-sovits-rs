[package]
name = "gpt-sovits-client"
version = "1.3.0"
edition = "2021"
description = "Command-line HTTP client for a running GPT-SoVITS service"
license = "MIT"
repository = "https://github.com/ricardomlee/gpt-sovits-rs"
publish = false

[dependencies]
anyhow = "1"
clap = { version = "4.5", features = ["derive"] }
hound = "3.5"
serde_json = "1"
tempfile = "3.14"
ureq = { version = "2.12", features = ["json"] }
url = "2"

[dev-dependencies]
tiny_http = "0.12"

[profile.release]
lto = "thin"
codegen-units = 1
