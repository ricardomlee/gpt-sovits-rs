name: First-run acceptance

on:
  pull_request:
    paths:
      - examples/first-run/**
      - tests/first_run.rs
      - .github/workflows/first-run.yml
  push:
    branches: [master]
    paths:
      - examples/first-run/**
      - tests/first_run.rs
      - .github/workflows/first-run.yml
  workflow_dispatch:

permissions:
  contents: read

jobs:
  published-image:
    name: Download, convert, serve, and synthesize (v1.2.0 CPU)
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7

      - name: Set isolated demo paths
        run: |
          printf 'DEMO_DIR=%s/gpt-sovits-demo\n' "$RUNNER_TEMP" >> "$GITHUB_ENV"
          printf 'ARTIFACT_DIR=%s/first-run-artifacts\n' "$RUNNER_TEMP" >> "$GITHUB_ENV"

      - name: Install test tools
        run: |
          sudo apt-get update
          sudo apt-get install -y libsoxr-dev shellcheck
          shellcheck examples/first-run/*.sh
          docker compose -f examples/first-run/compose.yml config --quiet

      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2

      - name: Verify the published baseline from an empty directory
        env:
          DEMO_IMAGE: ghcr.io/ricardomlee/gpt-sovits-rs:1.2.0
          DEMO_EXPECTED_VERSION: 1.2.0
        run: bash examples/first-run/verify.sh "$DEMO_DIR" "$ARTIFACT_DIR"

      - name: Upload audio and diagnostics, never models
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: first-run-v1.2.0-cpu
          path: ${{ runner.temp }}/first-run-artifacts/
          retention-days: 7
          if-no-files-found: ignore
